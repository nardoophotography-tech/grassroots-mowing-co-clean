  <rect x="734" y="178" width="32" height="22" fill="#050100"/>
  <!-- Right cluster -->
  <rect x="818" y="92" width="64" height="92" fill="#080200"/>
  <rect x="838" y="75" width="26" height="22" fill="#050100"/>
  <rect x="856" y="82" width="16" height="102" fill="#0D0401"/>
  <!-- Far right -->
  <rect x="938" y="103" width="48" height="82" fill="#0D0401"/>
  <rect x="953" y="86" width="20" height="22" fill="#080200"/>
