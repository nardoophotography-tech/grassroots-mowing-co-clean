<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C1208"/>
      <stop offset="100%" stop-color="#0D0401"/>
    </linearGradient>
  </defs>
  <!-- Selwyn Range ridge line -->
  <path d="M0,90 L55,74 L110,84 L165,62 L225,76 L285,52 L345,68 L405,55 L465,70 L525,46 L585,60 L645,40 L705,56 L765,39 L825,54 L885,44 L945,58 L1005,48 L1065,63 L1125,50 L1200,68 L1200,220 L0,220 Z" fill="url(#g)" opacity="0.85"/>
  <!-- Industrial left cluster -->
  <rect x="148" y="108" width="68" height="80" fill="#0D0401"/>
  <rect x="168" y="88" width="24" height="24" fill="#080200"/>
  <rect x="198" y="98" width="14" height="90" fill="#080200"/>
