  <ellipse cx="268" cy="97" rx="13" ry="7" fill="#1A2E08" opacity="0.7"/>
  <ellipse cx="888" cy="105" rx="19" ry="10" fill="#1A2E08" opacity="0.7"/>
  <ellipse cx="1058" cy="101" rx="15" ry="8" fill="#1A2E08" opacity="0.7"/>
