  <rect x="588" y="-20" width="15" height="208" fill="#030100"/>
  <rect x="580" y="168" width="31" height="22" fill="#080200"/>
  <!-- Banding -->
  <rect x="588" y="8" width="15" height="11" fill="#3D0A06" opacity="0.7"/>
  <rect x="588" y="32" width="15" height="7" fill="#3D0A06" opacity="0.5"/>
  <!-- Second stack -->
  <rect x="628" y="18" width="10" height="162" fill="#050100"/>
  <rect x="621" y="170" width="24" height="18" fill="#080200"/>
  <!-- Third short stack -->
  <rect x="653" y="52" width="8" height="128" fill="#0D0401"/>
  <!-- HEADFRAME (A-frame) -->
  <polygon points="728,188 750,2 772,188" fill="none" stroke="#030100" stroke-width="5"/>
  <line x1="734" y1="150" x2="767" y2="150" stroke="#080200" stroke-width="3"/>
  <line x1="737" y1="110" x2="764" y2="110" stroke="#080200" stroke-width="2.5"/>
